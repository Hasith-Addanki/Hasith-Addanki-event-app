<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTalks 2026 | One Day Event</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --lunch-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 4rem;
        }

        header {
            background: linear-gradient(to bottom right, #1e293b, #0f172a);
            padding: 4rem 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .search-container {
            margin-bottom: 2rem;
            position: sticky;
            top: 1rem;
            z-index: 10;
        }

        #search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            outline: none;
            transition: border-color 0.2s;
        }

        #search-input:focus {
            border-color: var(--primary-color);
        }

        .schedule {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .talk-card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
        }

        .talk-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .talk-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .time {
            font-family: monospace;
            background-color: #1e293b;
            color: var(--accent-color);
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid #334155;
        }

        .talk-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .speakers {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
        }

        .description {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--accent-color);
            padding: 0.2rem 0.6rem;
            border-radius: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .lunch-break {
            background-color: var(--lunch-bg);
            padding: 1rem;
            text-align: center;
            border-radius: 1rem;
            color: var(--text-muted);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            opacity: 0.8;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .talk-header { flex-direction: column-reverse; gap: 0.5rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>TechTalks June 2026</h1>
    <p class="subtitle">A Deep Dive into Modern Engineering | 1 Day, 6 Tracks</p>
</header>

<div class="container">
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by category (e.g., Cloud, AI, Frontend)..." autocomplete="off">
    </div>

    <div id="schedule" class="schedule">
        <!-- Rendered by JavaScript -->
    </div>
</div>

<script>
    const talks = [
        {
            id: 1,
            title: "Scaling Cloud Native Architecture in 2026",
            speakers: ["Elena Rodriguez", "Marcus Chen"],
            category: ["Cloud", "Kubernetes", "Scalability"],
            duration: "60 mins",
            start: "10:00 AM",
            end: "11:00 AM",
            description: "Explore the latest trends in serverless orchestration and how global companies are managing petabyte-scale data using regional cloud meshes."
        },
        {
            id: 2,
            title: "Large Language Models: From Research to Production",
            speakers: ["Dr. Sarah Jenkins"],
            category: ["AI", "MLOps", "NLP"],
            duration: "60 mins",
            start: "11:10 AM",
            end: "12:10 PM",
            description: "A practical guide to fine-tuning and deploying LLMs on edge devices without compromising performance or privacy."
        },
        {
            id: 3,
            title: "Defending the Perimeter: Zero Trust in a Remote World",
            speakers: ["James Wilson"],
            category: ["Security", "Network", "DevSecOps"],
            duration: "60 mins",
            start: "12:20 PM",
            end: "01:20 PM",
            description: "Why traditional VPNs are dead and how to implement a robust Zero Trust architecture for distributed engineering teams."
        },
        {
            isBreak: true,
            title: "Lunch Break",
            start: "01:20 PM",
            end: "02:20 PM"
        },
        {
            id: 4,
            title: "The Future of Web: Beyond React and Vue",
            speakers: ["Akiro Tanaka", "Lisa Meyer"],
            category: ["Frontend", "Performance", "WebAssembly"],
            duration: "60 mins",
            start: "02:20 PM",
            end: "03:20 PM",
            description: "A look at the next generation of web frameworks that leverage WASM for near-native performance in the browser."
        },
        {
            id: 5,
            title: "Rust for Systems Programming: Safe and Fast",
            speakers: ["Klaus Mueller"],
            category: ["Rust", "Systems", "Performance"],
            duration: "60 mins",
            start: "03:30 PM",
            end: "04:30 PM",
            description: "Deep dive into memory safety guarantees and why the industry is migrating mission-critical systems from C++ to Rust."
        },
        {
            id: 6,
            title: "DevOps is Dead, Long Live Platform Engineering",
            speakers: ["Jordan Smith"],
            category: ["DevOps", "Infrastructure", "Automation"],
            duration: "60 mins",
            start: "04:40 PM",
            end: "05:40 PM",
            description: "Shifting from ticket-based infrastructure to self-service internal developer platforms. How to empower developers without sacrificing control."
        }
    ];

    const scheduleEl = document.getElementById('schedule');
    const searchInput = document.getElementById('search-input');

    function renderSchedule(filter = '') {
        scheduleEl.innerHTML = '';
        const lowerFilter = filter.toLowerCase();

        const filteredTalks = talks.filter(item => {
            if (item.isBreak) return true; // Always show lunch break
            return item.category.some(cat => cat.toLowerCase().includes(lowerFilter)) ||
                   item.title.toLowerCase().includes(lowerFilter);
        });

        if (filteredTalks.length === 1 && filteredTalks[0].isBreak) {
             scheduleEl.innerHTML = '<div class="no-results">No talks found matching your search.</div>';
             return;
        }

        filteredTalks.forEach(item => {
            if (item.isBreak) {
                const breakHtml = `
                    <div class="lunch-break">
                        <span>${item.start} - ${item.end}</span>
                        <span>🍴 ${item.title}</span>
                    </div>
                `;
                scheduleEl.insertAdjacentHTML('beforeend', breakHtml);
            } else {
                const talkHtml = `
                    <div class="talk-card">
                        <div class="talk-header">
                            <div>
                                <h2 class="talk-title">${item.title}</h2>
                                <div class="speakers">by ${item.speakers.join(' & ')}</div>
                            </div>
                            <span class="time">${item.start} - ${item.end}</span>
                        </div>
                        <p class="description">${item.description}</p>
                        <div class="tags">
                            ${item.category.map(cat => `<span class="tag">${cat}</span>`).join('')}
                        </div>
                    </div>
                `;
                scheduleEl.insertAdjacentHTML('beforeend', talkHtml);
            }
        });
    }

    searchInput.addEventListener('input', (e) => {
        renderSchedule(e.target.value);
    });

    // Initial render
    renderSchedule();
</script>

</body>
</html>
